name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 고정 서명 키. 릴리스마다 서명이 같아야 사용자가 앱을 지우지 않고 업데이트할 수 있다.
      # 키가 없으면 디버그 키로 서명한다. 태그 빌드는 키가 없으면 실패시킨다.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "고정 서명 키를 사용합니다."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::KEYSTORE_BASE64 secret이 없습니다. 릴리스는 고정 서명 키로만 만듭니다."
            exit 1
          else
            echo "고정 서명 키가 없어 디버그 키로 서명합니다."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect files
        run: |
          cp app/build/outputs/apk/release/app-release.apk ai-whip.apk
          cp docs/install-guide.html install-guide.html

      # 서명 인증서 지문을 로그에 남긴다. 릴리스끼리 지문이 같은지 확인하는 용도.
      - name: Print signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ai-whip.apk | grep -E "SHA-256|DN"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-whip-apk
          path: ai-whip.apk

      # v로 시작하는 태그를 push하면 Releases에 APK를 올린다.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install-guide.html
            ai-whip.apk
